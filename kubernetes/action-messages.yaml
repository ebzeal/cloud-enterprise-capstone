apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-messages
  namespace: techpathway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: action-messages
  template:
    metadata:
      labels:
        app: action-messages
    spec:
      containers:
        - name: action-messages
          image: 898220629935.dkr.ecr.us-east-1.amazonaws.com/action-messages:latest
          ports:
            - containerPort: 5001

          env:
            - name: FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: techpathway-secrets
                  key: FROM_EMAIL

            - name: FROM_NAME
              valueFrom:
                secretKeyRef:
                  name: techpathway-secrets
                  key: FROM_NAME

            - name: ALWAYS_CC_EMAIL
              valueFrom:
                secretKeyRef:
                  name: techpathway-secrets
                  key: ALWAYS_CC_EMAIL

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 20
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: action-messages
  namespace: techpathway
spec:
  selector:
    app: action-messages
  ports:
    - port: 5001
      targetPort: 5001
  type: ClusterIP